<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday, Arpita 🎂</title>
  <meta name="description" content="A heartfelt birthday wish for Arpita — with love, music, and memories." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════ VOLUME GATE OVERLAY ═══════════ -->
  <div id="entry-overlay">
    <div class="entry-content">
      <div class="entry-icon">🎂</div>
      <h2 class="entry-title">Arpita's Birthday</h2>
      <p class="entry-subtitle">Before we begin, turn your volume all the way up</p>

      <div class="volume-check">
        <div class="volume-bar-container">
          <div class="volume-bar" id="volume-bar">
            <div class="volume-fill" id="volume-fill"></div>
          </div>
          <div class="volume-labels">
            <span>🔇</span>
            <span>🔊</span>
          </div>
        </div>
        <p class="volume-status" id="volume-status">Drag to set your volume to maximum</p>
        <input type="range" id="volume-slider" min="0" max="100" value="50" class="volume-slider" />
      </div>

      <button class="entry-btn" id="entry-btn" disabled>
        <span class="btn-lock">🔒</span>
        <span class="btn-text">Turn volume to max to enter</span>
      </button>

      <p class="entry-hint">✨ An experience awaits ✨</p>
    </div>
  </div>

  <!-- ═══════════ BACKGROUND MUSIC ═══════════ -->
  <audio id="bg-music" loop preload="auto">
    <source src="birthday.wav" type="audio/wav" />
    <source src="birthday.mp3" type="audio/mpeg" />
  </audio>

  <!-- ═══════════ FLOATING PARTICLES ═══════════ -->
  <canvas id="particles"></canvas>

  <!-- ═══════════ MAIN CONTENT ═══════════ -->
  <main id="main-content" class="hidden">

    <!-- HERO SECTION — portfolio style: text left, photo right -->
    <section class="hero">
      <div class="hero-left">
        <p class="hero-prelude" id="hero-prelude"></p>
        <h1 class="hero-name" id="hero-name"></h1>
        <div class="hero-divider"><span></span><span class="diamond">◆</span><span></span></div>
        <h2 class="hero-wish-title" id="hero-wish-title"></h2>
        <p class="hero-wish" id="hero-wish"></p>
        <p class="hero-sign" id="hero-sign"></p>
      </div>
      <div class="hero-right">
        <div class="hero-ring">
          <div class="ring-glow"></div>
          <div class="hero-photo-wrapper">
            <img src="main.jpg" alt="Arpita" class="hero-photo" id="hero-photo" />
          </div>
          <!-- Floating orbit icons -->
          <div class="orbit-icon orbit-1">🎂</div>
          <div class="orbit-icon orbit-2">🎁</div>
          <div class="orbit-icon orbit-3">🎈</div>
          <div class="orbit-icon orbit-4">💖</div>
        </div>
      </div>
    </section>

    <!-- MEMORY CAROUSEL SECTION -->
    <section class="memories">
      <h2 class="section-title" id="section-title"></h2>
      <p class="section-subtitle" id="section-subtitle"></p>

      <div class="carousel-container">
        <div class="carousel-track" id="carousel-track"></div>
        <button class="carousel-btn carousel-prev" aria-label="Previous slide">&#10094;</button>
        <button class="carousel-btn carousel-next" aria-label="Next slide">&#10095;</button>
        <div class="carousel-dots" id="carousel-dots"></div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer" id="footer-text"></footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
